<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11/C Sınıfı Önü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }
        body {
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* MENÜLER (SEÇİM EKRANLARI) */
        .menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }
        .hidden { display: none !important; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffcc00; }
        .btn-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .char-card {
            background: #2a2a2a; border: 4px solid #444; border-radius: 50%;
            width: 160px; height: 160px; cursor: pointer; transition: transform 0.2s;
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .char-card:hover { transform: scale(1.1); border-color: #ffcc00; }
        .char-card img { width: 100%; height: 100%; object-fit: cover; }
        .char-label { margin-top: 10px; font-weight: bold; font-size: 1.1rem; }
        .diff-btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; color: #000; transition: transform 0.2s;
        }
        #btn-easy { background: #2ecc71; }
        #btn-medium { background: #f1c40f; }
        #btn-hard { background: #e74c3c; }
        .diff-btn:hover { transform: scale(1.05); }

        /* OYUN HARİTASI (TÜM EKRAN) */
        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #2c3e50; /* Genel zemin */
            display: none;
        }

        /* 11/C SINIFI İÇİ */
        .room-11c {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 50vh;
            background: #34495e;
            border-bottom: 8px solid #7f8c8d;
        }
        .room-label {
            position: absolute; top: 10px; left: 20px;
            font-size: 1.5rem; font-weight: bold; color: #bdc3c7;
        }

        /* SIRALAR (YAVAŞLATMA BÖLGELERİ) */
        .desk {
            position: absolute;
            background: #d35400;
            border: 3px solid #a04000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
        }

        /* KORİDOR */
        .corridor {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw; height: 50vh;
            background: #7f8c8d;
        }
        .corridor-label {
            position: absolute; bottom: 10px; left: 20px;
            font-size: 1.5rem; font-weight: bold; color: #34495e;
        }

        /* KIRMIZI ÇÖP KUTUSU (DOĞUŞ NOKTASI) */
        #red-bin {
            position: absolute;
            bottom: 40px; left: 50px;
            width: 45px; height: 45px;
            background: #e74c3c;
            border: 3px solid #c0392b;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* OYUNCU (BRAWL STARS TARZI YUVARLAK) */
        #player {
            position: absolute;
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 3px solid #ffcc00;
            background-size: cover;
            background-position: center;
            z-index: 10;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* DÜŞMAN (KÜRT) */
        .enemy {
            position: absolute;
            width: 50px; height: 50px;
            background: #27ae60;
            border-radius: 50%;
            border: 2px solid #1e8449;
            z-index: 9;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .enemy-text {
            position: absolute;
            top: -25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ff3333;
            padding: 2px 6px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* MERMİ */
        .bullet {
            position: absolute;
            width: 12px; height: 12px;
            background: #f1c40f;
            border-radius: 50%;
            z-index: 8;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #f1c40f;
        }

        /* HUD / ARAYÜZ */
        #hud {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 15px; border-radius: 8px;
            font-size: 1.2rem; font-weight: bold;
            z-index: 50; display: flex; flex-direction: column; gap: 5px;
        }

        /* MOBİL KONTROLLER (DOKUNMATİK) */
        #mobile-controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 80;
            display: none; /* JS ile mobilde açılacak */
        }
        .joystick-zone {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px; background: rgba(255,255,255,0.1);
            border-radius: 50%; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .joystick-stick {
            width: 50px; height: 50px; background: rgba(255,255,255,0.5);
            border-radius: 50%;
        }
        .fire-button {
            position: absolute; bottom: 50px; right: 50px;
            width: 80px; height: 80px; background: rgba(231, 76, 60, 0.7);
            border: 3px solid #c0392b; border-radius: 50%; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.1rem; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .fire-button:active { background: rgba(231, 76, 60, 0.9); transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- 1. ADIM: KARAKTER SEÇİMİ -->
    <div id="char-screen" class="menu-screen">
        <h1>11/C Sınıfı Önü - Karakter Seç</h1>
        <div style="display: flex; gap: 40px;">
            <div>
                <div class="char-card" onclick="selectCharacter('berat.jpeg')">
                    <img src="berat.jpeg" onerror="this.src='https://via.placeholder.com/160/2980b9/ffffff?text=BERAT'">
                </div>
                <div class="char-label">BERAT ÖZER</div>
            </div>
            <div>
                <div class="char-card" onclick="selectCharacter('tugba.jpeg')">
                    <img src="tugba.jpeg" onerror="this.src='https://via.placeholder.com/160/e74c3c/ffffff?text=TUGBA'">
                </div>
                <div class="char-label">TUĞBA GÜRÜZ</div>
            </div>
        </div>
    </div>

    <!-- 2. ADIM: ZORLUK SEÇİMİ -->
    <div id="diff-screen" class="menu-screen hidden">
        <h1>Zorluk Derecesi Seç</h1>
        <div class="btn-container">
            <button id="btn-easy" class="diff-btn" onclick="setDifficulty('easy')">KOLAY</button>
            <button id="btn-medium" class="diff-btn" onclick="setDifficulty('medium')">ORTA</button>
            <button id="btn-hard" class="diff-btn" onclick="setDifficulty('hard')">ZOR</button>
        </div>
    </div>

    <!-- 3. ADIM: OYUN ALANI -->
    <div id="game-area">
        <!-- Sınıf İçi -->
        <div class="room-11c" id="room-area">
            <div class="room-label">11/C SINIFI</div>
            <!-- Sıralar Dinamik Olarak JS ile Gelecek -->
        </div>

        <!-- Koridor -->
        <div class="corridor">
            <div class="corridor-label">KORİDOR</div>
            <!-- Başlangıç Noktası Çöp Kutusu -->
            <div id="red-bin"></div>
        </div>

        <!-- Oyuncu Nesnesi -->
        <div id="player"></div>

        <!-- Skor Arayüzü -->
        <div id="hud">
            <div>CAN: <span id="hud-hp">100</span></div>
            <div>MERMİ: <span id="hud-ammo">30</span></div>
            <div>SKOR: <span id="hud-score">0</span></div>
        </div>

        <!-- Mobil Kontroller -->
        <div id="mobile-controls">
            <div class="joystick-zone" id="joy-zone">
                <div class="joystick-stick" id="joy-stick"></div>
            </div>
            <div class="fire-button" id="mobile-fire">ATEŞ</div>
        </div>

        <!-- Oyun Bitti Paneli -->
        <div id="game-over" class="menu-screen hidden" style="background: rgba(0,0,0,0.9);">
            <h1 style="color: #ff3333; font-size: 3.5rem;">NAKAVT!</h1>
            <p style="font-size: 1.5rem; margin-bottom: 20px;">Toplam Skorun: <span id="final-score">0</span></p>
            <button class="diff-btn" style="background: #ffcc00;" onclick="location.reload()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        // Oyun Değişkenleri
        let selectedImg = '';
        let difficulty = 'medium';
        let config = { playerSpeed: 5, enemySpeed: 2, maxAmmo: 30 };

        let player = { x: 75, y: 0, vx: 0, vy: 0, hp: 100, score: 0, ammo: 30, angle: 0 };
        let keys = {};
        let desks = [];
        let enemies = [];
        let bullets = [];
        let isMobile = false;

        // Joystick Değişkenleri
        let joyX = 0, joyY = 0;

        // Ekran elementleri
        const gameArea = document.getElementById('game-area');
        const playerEl = document.getElementById('player');

        // Mobil Cihaz Kontrolü
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            isMobile = true;
            document.getElementById('mobile-controls').style.display = 'block';
        }

        // 1. Karakter Seçimi
        function selectCharacter(img) {
            selectedImg = img;
            document.getElementById('char-screen').classList.add('hidden');
            document.getElementById('diff-screen').classList.remove('hidden');
        }

        // 2. Zorluk Seçimi ve Kurulum
        function setDifficulty(diff) {
            difficulty = diff;
            document.getElementById('diff-screen').classList.add('hidden');
            gameArea.style.display = 'block';

            // Başlangıç Y Pozisyonu Çöp Kutusunun Yanı (Ekran boyuna göre dinamik)
            player.y = window.innerHeight - 60;

            if (diff === 'easy') {
                config.enemySpeed = 1.8;
                config.maxAmmo = 45;
            } else if (diff === 'medium') {
                config.enemySpeed = 3.2;
                config.maxAmmo = 30;
            } else if (diff === 'hard') {
                config.enemySpeed = 4.8;
                config.maxAmmo = 15;
            }

            player.ammo = config.maxAmmo;
            playerEl.style.backgroundImage = `url('${selectedImg}')`;

            buildClassroomDesks();
            initGameLoop();
        }

        // Sınıf İçine Sıraları Yerleştirme
        function buildClassroomDesks() {
            const room = document.getElementById('room-area');
            const roomHeight = window.innerHeight * 0.5;
            const roomWidth = window.innerWidth;

            // 3 Sıra halinde masalar dizelim
            let deskId = 1;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 5; col++) {
                    const d = document.createElement('div');
                    d.classList.add('desk');
                    d.innerText = "SIRA";
                    
                    // Hesaplanan konumlar
                    let w = 80, h = 45;
                    let x = 100 + col * (w + 60);
                    let y = 60 + row * (h + 40);

                    // Ekran dışına taşmasın kontrolü
                    if (x + w < roomWidth && y + h < roomHeight) {
                        d.style.left = x + 'px';
                        d.style.top = y + 'px';
                        d.style.width = w + 'px';
                        d.style.height = h + 'px';
                        room.appendChild(d);

                        desks.push({ x: x, y: y, w: w, h: h });
                    }
                }
            }
        }

        // Klavye Dinleyicileri (PC)
        document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        
        // Fare Tıklaması ile Ateş Etme (PC)
        window.addEventListener('click', (e) => {
            if (document.getElementById('game-area').style.display !== 'block' || isMobile) return;
            shoot(e.clientX, e.clientY);
        });

        // Mobil Dokunmatik Joystick Yönetimi
        const joyZone = document.getElementById('joy-zone');
        const joyStick = document.getElementById('joy-stick');

        joyZone.addEventListener('touchstart', handleJoy);
        joyZone.addEventListener('touchmove', handleJoy);
        joyZone.addEventListener('touchend', () => {
            joyStick.style.transform = `translate(0px, 0px)`;
            joyX = 0; joyY = 0;
        });

        function handleJoy(e) {
            const touch = e.touches[0];
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let maxDist = rect.width / 2;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            // Değerleri -1 ile 1 arasına normalize et
            joyX = dx / maxDist;
            joyY = dy / maxDist;
        }

        // Mobil Ateş Etme Butonu
        document.getElementById('mobile-fire').addEventListener('touchstart', (e) => {
            e.preventDefault();
            // Baktığı yöne doğru (Ateş)
            let bx = player.x + Math.cos(player.angle) * 100;
            let by = player.y + Math.sin(player.angle) * 100;
            shoot(bx, by);
        });

        // Ateş Etme Fonksiyonu
        function shoot(targetX, targetY) {
            if (player.ammo <= 0) return;

            player.ammo--;
            document.getElementById('hud-ammo').innerText = player.ammo;

            let dx = targetX - player.x;
            let dy = targetY - player.y;
            let angle = Math.atan2(dy, dx);

            // Mobil için son yönü kilitle
            player.angle = angle;

            const bEl = document.createElement('div');
            bEl.classList.add('bullet');
            gameArea.appendChild(bEl);

            bullets.push({
                el: bEl,
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12
            });
        }

        // Düşman (KÜRT) Doğurma
        function spawnEnemy() {
            if (document.getElementById('game-area').style.display !== 'block') return;

            const eEl = document.createElement('div');
            eEl.classList.add('enemy');
            
            const txt = document.createElement('div');
            txt.classList.add('enemy-text');
            txt.innerText = 'KÜRT';
            eEl.appendChild(txt);
            gameArea.appendChild(eEl);

            // Sağ taraftan rastgele bir Y koordinatında doğsunlar
            let rx = window.innerWidth + 50;
            let ry = Math.random() * window.innerHeight;

            enemies.push({ el: eEl, x: rx, y: ry });
        }

        // ANA DÖNGÜ (GAME LOOP)
        function initGameLoop() {
            setInterval(spawnEnemy, 2000); // 2 saniyede bir düşman

            function update() {
                // 1. HAREKET MANTIĞI
                let speed = config.playerSpeed;

                // Sınıf içi sıra kontrolü (Sıranın içindeyse yavaşlat)
                let insideDesk = false;
                for (let d of desks) {
                    if (player.x >= d.x && player.x <= d.x + d.w && player.y >= d.y && player.y <= d.y + d.h) {
                        insideDesk = true;
                        break;
                    }
                }
                if (insideDesk) speed = speed * 0.4; // %60 Yavaşlama

                // Klavye Kontrolleri
                if (keys['w'] || keys['arrowup']) player.y -= speed;
                if (keys['s'] || keys['arrowdown']) player.y += speed;
                if (keys['a'] || keys['arrowleft']) player.x -= speed;
                if (keys['d'] || keys['arrowright']) player.x += speed;

                // Mobil Joystick Kontrolleri
                if (isMobile && (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1)) {
                    player.x += joyX * speed;
                    player.y += joyY * speed;
                    player.angle = Math.atan2(joyY, joyX); // Baktığı yönü güncelle
                }

                // Ekran Sınırları Koruma
                if (player.x < 25) player.x = 25;
                if (player.x > window.innerWidth - 25) player.x = window.innerWidth - 25;
                if (player.y < 25) player.y = 25;
                if (player.y > window.innerHeight - 25) player.y = window.innerHeight - 25;

                // Oyuncu Çizimi
                playerEl.style.left = player.x + 'px';
                playerEl.style.top = player.y + 'px';

                // 2. MERMİ HAREKETLERİ VE ÇARPIŞMALAR
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;
                    b.el.style.left = b.x + 'px';
                    b.el.style.top = b.y + 'px';

                    // Ekran dışı kontrolü
                    if (b.x < 0 || b.x > window.innerWidth || b.y < 0 || b.y > window.innerHeight) {
                        b.el.remove();
                        bullets.splice(i, 1);
                        continue;
                    }

                    // Düşman vurulma kontrolü
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let e = enemies[j];
                        let dist = Math.hypot(b.x - e.x, b.y - e.y);
                        if (dist < 30) { // Çarpışma yarıçapı
                            e.el.remove();
                            enemies.splice(j, 1);
                            b.el.remove();
                            bullets.splice(i, 1);
                            
                            player.score += 10;
                            document.getElementById('hud-score').innerText = player.score;
                            break;
                        }
                    }
                }

                // 3. DÜŞMAN HAREKETLERİ (KÜRT TAKİBİ)
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dx = player.x - e.x;
                    let dy = player.y - e.y;
                    let angle = Math.atan2(dy, dx);

                    e.x += Math.cos(angle) * config.enemySpeed;
                    e.y += Math.sin(angle) * config.enemySpeed;
                    
                    e.el.style.left = e.x + 'px';
                    e.el.style.top = e.y + 'px';

                    // Oyuncuya Değdi mi? (Hasar)
                    let pDist = Math.hypot(player.x - e.x, player.y - e.y);
                    if (pDist < 45) {
                        player.hp -= 10;
                        document.getElementById('hud-hp').innerText = player.hp;
                        e.el.remove();
                        enemies.splice(j, 1);

                        if (player.hp <= 0) {
                            gameOver();
                        }
                    }
                }

                if (player.hp > 0) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        // Oyun Bitti
        function gameOver() {
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').innerText = player.score;
        }
    </script>
</body>
</html>
