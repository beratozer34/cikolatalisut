<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11/C Sınıfı Önü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* KARAKTER SEÇİM EKRANI */
        #selection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #1a1a1a;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        #selection-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #ffcc00;
        }

        .char-container {
            display: flex;
            gap: 40px;
        }

        .char-card {
            background: #2a2a2a;
            border: 4px solid #444;
            border-radius: 15px;
            padding: 20px;
            width: 220px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .char-card:hover {
            transform: scale(1.05);
            border-color: #ffcc00;
        }

        .char-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #555;
        }

        /* OYUN ALANI */
        #game-container {
            display: none;
            position: relative;
            width: 900px;
            height: 500px;
            background: #3a2e2b; /* Okul koridoru arka plan rengi */
            border: 6px solid #222;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Gerçek Okul Duvarı Görünümü (Çizgili/Tuğlalı) */
        .school-wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 80%;
            background-image: linear-gradient(rgba(0,0,0,0.15) 2px, transparent 2px),
                              linear-gradient(90deg, rgba(0,0,0,0.15) 2px, transparent 2px);
            background-size: 50px 25px;
            border-bottom: 8px solid #2a201d;
        }

        /* Sınıf Kapısı ve Tabelası */
        .classroom-door {
            position: absolute;
            bottom: 20%;
            left: 200px;
            width: 100px;
            height: 220px;
            background: #8b5a2b;
            border: 4px solid #5c3a1a;
        }

        #class-sign {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #bf1515;
            color: white;
            padding: 8px 30px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid #fff;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Arayüz */
        #ui {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: bold;
            z-index: 5;
        }

        .hp-container {
            width: 200px; height: 22px;
            background: #444; border: 2px solid #fff;
            border-radius: 5px; overflow: hidden;
        }

        #hp-bar { width: 100%; height: 100%; background: #2ecc71; }

        /* 2D KARAKTER YAPISI (Gövde + Kafa Ayrımı) */
        #player-wrapper {
            position: absolute;
            width: 70px;
            height: 120px;
            bottom: 20%; /* Sınıf taban çizgisi */
            left: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Gerçek Fotoğraftan Oluşan Kafa */
        .player-head {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid #fff;
            z-index: 2;
        }

        /* 2D Kıyafetli/Zırhlı Gövde */
        .player-body {
            width: 45px;
            height: 65px;
            background: #2980b9; /* Berat için mavi gövde (kodla dinamik değişir) */
            border-radius: 10px 10px 5px 5px;
            position: relative;
            margin-top: -5px;
            z-index: 1;
            border: 2px solid #1f618d;
        }

        /* Silah Tutan Kol */
        .player-arm {
            position: absolute;
            width: 30px;
            height: 12px;
            background: #3498db;
            right: -20px;
            top: 15px;
            border-radius: 5px;
            border: 2px solid #1f618d;
        }

        /* Mermi / Lazer */
        .laser {
            position: absolute;
            width: 25px;
            height: 8px;
            background: #ff5722;
            box-shadow: 0 0 8px #ff5722;
            border-radius: 4px;
        }

        /* Düşman (Kürt Canavarı) */
        .enemy {
            position: absolute;
            width: 65px; height: 100px;
            bottom: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .enemy-monster {
            font-size: 50px;
            line-height: 1;
        }

        /* Okul Tabanı / Zemin */
        .floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 20%;
            background: #7f8c8d;
            border-top: 6px solid #95a5a6;
        }

        /* Ekranlar */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 8;
        }

        #restart-btn {
            margin-top: 20px; padding: 10px 30px;
            font-size: 1.2rem; background: #ffcc00;
            color: #000; border: none; cursor: pointer; font-weight: bold;
        }

        #controls { margin-top: 15px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- SEÇİM EKRANI -->
    <div id="selection-screen">
        <h1>11/C Sınıfı Önü</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('berat.jpeg', '#2980b9')">
                <img src="berat.jpeg" class="char-img" onerror="this.src='https://via.placeholder.com/140?text=BERAT'">
                <h3>BERAT ÖZER</h3>
            </div>
            <div class="char-card" onclick="startGame('tugba.jpeg', '#e74c3c')">
                <img src="tugba.jpeg" class="char-img" onerror="this.src='https://via.placeholder.com/140?text=TUGBA'">
                <h3>TUĞBA GÜRÜZ</h3>
            </div>
        </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-container">
        <div class="school-wall"></div>
        <div class="classroom-door"></div>
        <div id="class-sign">11/C SINIFI ÖNÜ</div>
        
        <div id="ui">
            <div>
                <div>CAN</div>
                <div class="hp-container"><div id="hp-bar"></div></div>
            </div>
            <div>SKOR: <span id="score-val">0</span></div>
        </div>

        <!-- 2D PARÇALI KARAKTER -->
        <div id="player-wrapper">
            <div id="p-head" class="player-head"></div>
            <div id="p-body" class="player-body">
                <div class="player-arm"></div>
            </div>
        </div>

        <div class="floor"></div>

        <div id="game-over-screen">
            <h1 style="color: #ff3333; font-size: 3rem;">Oyun Bitti</h1>
            <p>Skorun: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="resetGame()">Yeniden Başla</button>
        </div>
    </div>

    <div id="controls">Ateş: <b>BOŞLUK (SPACE)</b> | Zıplama: <b>W veya YUKARI OK</b></div>

    <script>
        const selectionScreen = document.getElementById('selection-screen');
        const gameContainer = document.getElementById('game-container');
        const playerWrapper = document.getElementById('player-wrapper');
        const pHead = document.getElementById('p-head');
        const pBody = document.getElementById('p-body');
        const hpBar = document.getElementById('hp-bar');
        const scoreVal = document.getElementById('score-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');

        let isJumping = false;
        let playerBottom = 100; // %20 floor yüksekliğine denk taban ayarı
        let gravity = 4;
        let score = 0;
        let health = 100;
        let gameActive = false;

        let lasers = [];
        let enemies = [];
        let gameInterval;
        let enemySpawnInterval;

        function startGame(imgName, bodyColor) {
            selectionScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            
            // Kafaya yüklenen resmi bas, gövde rengini ayarla
            pHead.style.backgroundImage = `url('${imgName}')`;
            pBody.style.backgroundColor = bodyColor;
            
            gameActive = true;
            runGame();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if ((e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') && !isJumping) {
                jump();
            }
            if (e.key === ' ' || e.code === 'Space') {
                shoot();
                e.preventDefault();
            }
        });

        function jump() {
            isJumping = true;
            let jumpHeight = 0;
            let upInterval = setInterval(() => {
                if (jumpHeight >= 150 || !gameActive) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (playerBottom <= 100 || !gameActive) {
                            clearInterval(downInterval);
                            playerBottom = 100;
                            playerWrapper.style.bottom = '20%';
                            isJumping = false;
                        } else {
                            playerBottom -= gravity * 1.5;
                            playerWrapper.style.bottom = playerBottom + 'px';
                        }
                    }, 10);
                } else {
                    jumpHeight += 6;
                    playerBottom += 6;
                    playerWrapper.style.bottom = playerBottom + 'px';
                }
            }, 10);
        }

        function shoot() {
            const laser = document.createElement('div');
            laser.classList.add('laser');
            laser.style.left = '160px';
            laser.style.bottom = (playerBottom + 45) + 'px';
            gameContainer.appendChild(laser);
            lasers.push(laser);
        }

        function spawnEnemy() {
            if (!gameActive) return;
            const enemy = document.createElement('div');
            enemy.classList.add('enemy');
            enemy.style.right = '-70px';
            enemy.style.bottom = '20%';
            
            // Canavar Görsel Alanı
            const monster = document.createElement('div');
            monster.classList.add('enemy-monster');
            monster.innerHTML = '👹'; // Kürt Canavarı emojisi
            
            enemy.appendChild(monster);
            gameContainer.appendChild(enemy);
            enemies.push(enemy);
        }

        function runGame() {
            enemySpawnInterval = setInterval(spawnEnemy, 1500);

            gameInterval = setInterval(() => {
                if (!gameActive) return;

                // Lazer hareketleri
                for (let i = lasers.length - 1; i >= 0; i--) {
                    let l = lasers[i];
                    let lLeft = parseInt(l.style.left) || 160;
                    lLeft += 10;
                    l.style.left = lLeft + 'px';

                    if (lLeft > 900) {
                        l.remove();
                        lasers.splice(i, 1);
                        continue;
                    }

                    // Vurulma kontrolü
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let e = enemies[j];
                        let eLeft = 900 - (parseInt(e.style.right) || 0) - 65;
                        let lBottom = parseInt(l.style.bottom);

                        if (lLeft + 25 >= eLeft && lLeft <= eLeft + 65 && lBottom >= playerBottom && lBottom <= playerBottom + 100) {
                            e.remove();
                            enemies.splice(j, 1);
                            l.remove();
                            lasers.splice(i, 1);
                            score += 10;
                            scoreVal.innerText = score;
                            break;
                        }
                    }
                }

                // Canavar hareketleri
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let eRight = parseInt(e.style.right) || 0;
                    eRight += 5;
                    e.style.right = eRight + 'px';

                    let eLeft = 900 - eRight - 65;

                    if (eLeft < -70) {
                        e.remove();
                        enemies.splice(j, 1);
                        continue;
                    }

                    // Hasar kontrolü
                    if (eLeft <= 160 && eLeft + 65 >= 100) {
                        if (playerBottom <= 180) { // Zıplama kurtarma kontrolü
                            health -= 25;
                            if (health < 0) health = 0;
                            hpBar.style.width = health + '%';
                            
                            e.remove();
                            enemies.splice(j, 1);

                            if (health <= 0) {
                                gameActive = false;
                                clearInterval(gameInterval);
                                clearInterval(enemySpawnInterval);
                                finalScore.innerText = score;
                                gameOverScreen.style.display = 'flex';
                            }
                        }
                    }
                }
            }, 20);
        }

        function resetGame() {
            lasers.forEach(l => l.remove());
            enemies.forEach(e => e.remove());
            lasers = []; enemies = [];
            score = 0; health = 100;
            playerBottom = 100; isJumping = false;
            scoreVal.innerText = '0';
            hpBar.style.width = '100%';
            playerWrapper.style.bottom = '20%';
            gameOverScreen.style.display = 'none';
            selectionScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
