<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11/C Sınıfı Önü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }
        body {
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* MENÜLER VE SEÇİM EKRANLARI */
        .menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }
        .hidden { display: none !important; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffcc00; }
        .char-wrapper { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .char-box { display: flex; flex-direction: column; align-items: center; }
        .char-card {
            background: #2a2a2a; border: 4px solid #444; border-radius: 50%;
            width: 150px; height: 150px; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .char-card:hover { transform: scale(1.1); border-color: #ffcc00; }
        .char-card img { width: 100%; height: 100%; object-fit: cover; }
        .char-label { margin-top: 10px; font-weight: bold; font-size: 1.1rem; color: #fff; }
        
        /* 3. KARAKTER POPUP ANIMASYONU */
        #popup-msg {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffcc00;
            border-radius: 15px;
            padding: 30px;
            width: 90%; max-width: 450px;
            z-index: 200; text-align: center;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.7);
            animation: popupIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popupIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #popup-msg p { font-size: 1.3rem; font-weight: bold; line-height: 1.6; color: #fff; }
        #popup-msg span { color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.5); }
        .close-popup {
            position: absolute; top: 10px; right: 15px;
            font-size: 24px; color: #aaa; cursor: pointer; font-weight: bold;
        }
        .close-popup:hover { color: #ff3333; }

        .diff-btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; color: #000; transition: transform 0.2s; margin: 10px;
        }
        #btn-easy { background: #2ecc71; }
        #btn-medium { background: #f1c40f; }
        #btn-hard { background: #e74c3c; }

        /* GERÇEKÇİ 2D OKUL HARİTASI */
        #game-area {
            position: relative;
            width: 100vw; height: 100vh;
            background: #566573;
            display: none;
        }

        /* 11/C SINIFA AİT ALAN */
        .room-11c {
            position: absolute; top: 0; left: 0; width: 100vw; height: 50vh;
            background: #eaecee; /* Sınıf içi parke/beton rengi */
            background-image: radial-gradient(#bdc3c7 15%, transparent 16%);
            background-size: 30px 30px;
            border-bottom: 12px solid #2c3e50; /* Sınıf duvarı kalınlığı */
        }
        .room-decorations {
            position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around;
        }
        .board { width: 180px; height: 10px; background: #1e8449; border: 2px solid #7e5109; }
        .teacher-desk { position: absolute; top: 40px; left: 40px; width: 70px; height: 50px; background: #a04000; border-radius: 4px; }
        .window-line { position: absolute; top: 0; left: 30%; width: 40%; height: 6px; background: #aed6f1; }

        /* SIRALAR (YAVAŞLATMA ALANLARI) */
        .desk {
            position: absolute; background: #ba4a00; border: 3px solid #5e2f0d; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #fff;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        /* GERÇEKÇİ OKUL KORİDORU */
        .corridor {
            position: absolute; bottom: 0; left: 0; width: 100vw; height: 50vh;
            background: #d5dbdb; /* Koridor zemin rengi */
            /* Gerçek fayans döşeme efekti */
            background-image: linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
                              linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .wall-panos {
            position: absolute; top: 15px; left: 400px; width: 250px; height: 8px; background: #cd6155; border: 1px solid #fff;
        }
        .classroom-door {
            position: absolute; top: -12px; left: 180px; width: 90px; height: 12px; background: #f5b041; z-index: 5;
        }

        /* KIRMIZI ÇÖP KUTUSU (DOĞUŞ NOKTASI) */
        #red-bin {
            position: absolute; bottom: 35px; left: 55px; width: 45px; height: 45px;
            background: #e74c3c; border: 3px solid #922b21; border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* OYUNCU (BRAWL STARS TARZI YUVARLAK) */
        #player {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            border: 3px solid #ffcc00; background-size: cover; background-position: center;
            z-index: 10; transform: translate(-50%, -50%); box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .name-tag {
            position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff; padding: 2px 8px;
            font-size: 0.8rem; font-weight: bold; border-radius: 4px; white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* DÜŞMAN (KÜRT) */
        .enemy {
            position: absolute; width: 52px; height: 52px; border-radius: 50%;
            z-index: 9; transform: translate(-50%, -50%);
            background-image: url('https://i.imgur.com/vH98gXm.png'), linear-gradient(#27ae60, #1e8449); /* Dahili canavar emojisi/resmi yedeğiyle */
            background-size: 80% 80%, cover; background-position: center; background-repeat: no-repeat;
            border: 3px solid #145a32; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .enemy-monster-style::before {
            content: "👹"; font-size: 32px; position: absolute; top: 4px; left: 7px;
        }
        .enemy-text {
            position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #ff3333; padding: 2px 8px;
            font-size: 0.85rem; font-weight: bold; border-radius: 4px; white-space: nowrap;
            border: 1px solid #ff3333;
        }

        /* MERMİ */
        .bullet {
            position: absolute; width: 14px; height: 14px; background: #f1c40f;
            border-radius: 50%; z-index: 8; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #f1c40f;
        }

        /* ARAYÜZ (HUD) */
        #hud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.75); padding: 15px; border-radius: 10px;
            font-size: 1.2rem; font-weight: bold; z-index: 50; display: flex; flex-direction: column; gap: 5px;
            border: 2px solid #444;
        }

        /* GELİŞMİŞ ÇİFT JOYSTICK SİSTEMİ (BRAWL STARS MOBİL) */
        #mobile-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 80; display: none;
        }
        .joystick-container {
            position: absolute; bottom: 40px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.08); border-radius: 50%; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.25);
        }
        #move-joy-container { left: 40px; }
        #shoot-joy-container { right: 40px; border-color: rgba(231, 76, 60, 0.4); background: rgba(231, 76, 60, 0.05); }
        .stick {
            width: 55px; height: 55px; border-radius: 50%; transition: transform 0.05s linear;
        }
        #move-stick { background: rgba(255, 255, 255, 0.45); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #shoot-stick { background: rgba(231, 76, 60, 0.65); box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
    </style>
</head>
<body>

    <!-- 1. ADIM: KARAKTER SEÇİMİ -->
    <div id="char-screen" class="menu-screen">
        <h1>11/C Sınıfı Önü - Karakter Seç</h1>
        <div class="char-wrapper">
            <div class="char-box">
                <div class="char-card" onclick="selectCharacter('berat.jpeg', 'BERAT ÖZER')">
                    <img src="berat.jpeg" onerror="this.src='https://via.placeholder.com/150/2980b9/ffffff?text=BERAT'">
                </div>
                <div class="char-label">BERAT ÖZER</div>
            </div>
            <div class="char-box">
                <div class="char-card" onclick="selectCharacter('tugba.jpeg', 'TUĞBA GÜRÜZ')">
                    <img src="tugba.jpeg" onerror="this.src='https://via.placeholder.com/150/e74c3c/ffffff?text=TUGBA'">
                </div>
                <div class="char-label">TUĞBA GÜRÜZ</div>
            </div>
            <div class="char-box">
                <div class="char-card" onclick="openPopup()" style="background: #ffffff;">
                    <div style="font-size: 50px; color: #111; font-weight: bold;">+</div>
                </div>
                <div class="char-label">DİĞER</div>
            </div>
        </div>

        <!-- YENİ 3. KARAKTER POPUP BİLGİLENDİRMESİ -->
        <div id="popup-msg" class="hidden">
            <span class="close-popup" onclick="closePopup()">&times;</span>
            <p>SEN DE BURDA YER ALMAK ISTIYORSAN <span>@ALİBEYKOYLUBERO</span> İNSTAGRAM HESABI UZERINDEN ILETISIME GEC.</p>
        </div>
    </div>

    <!-- 2. ADIM: ZORLUK SEÇİMİ -->
    <div id="diff-screen" class="menu-screen hidden">
        <h1>Zorluk Derecesi Seç</h1>
        <div class="btn-container">
            <button id="btn-easy" class="diff-btn" onclick="setDifficulty('easy')">KOLAY</button>
            <button id="btn-medium" class="diff-btn" onclick="setDifficulty('medium')">ORTA</button>
            <button id="btn-hard" class="diff-btn" onclick="setDifficulty('hard')">ZOR</button>
        </div>
    </div>

    <!-- 3. ADIM: GERÇEKÇİ OYUN HARİTASI -->
    <div id="game-area">
        <!-- Gerçek Sınıf Ortamı -->
        <div class="room-11c" id="room-area">
            <div class="window-line"></div>
            <div class="room-decorations">
                <div class="board"></div>
            </div>
            <div class="teacher-desk"></div>
        </div>

        <!-- Gerçek Koridor Ortamı -->
        <div class="corridor">
            <div class="wall-panos"></div>
            <div class="classroom-door"></div>
            <div id="red-bin"></div>
        </div>

        <!-- Dinamik İsim Etiketli Oyuncu -->
        <div id="player">
            <div id="player-name-tag" class="name-tag"></div>
        </div>

        <!-- Skor & Cephane Paneli -->
        <div id="hud">
            <div>CAN: <span id="hud-hp">100</span></div>
            <div>MERMİ: <span id="hud-ammo">30</span></div>
            <div>SKOR: <span id="hud-score">0</span></div>
        </div>

        <!-- GELİŞMİŞ ÇİFT JOYSTICK (MOBİL) -->
        <div id="mobile-controls">
            <!-- Hareket Joystick'i -->
            <div class="joystick-container" id="move-joy-container">
                <div class="stick" id="move-stick"></div>
            </div>
            <!-- Brawl Stars Usulü Ateş/Nişan Joystick'i -->
            <div class="joystick-container" id="shoot-joy-container">
                <div class="stick" id="shoot-stick"></div>
            </div>
        </div>

        <!-- Nakavt Ekranı -->
        <div id="game-over" class="menu-screen hidden" style="background: rgba(0,0,0,0.95);">
            <h1 style="color: #ff3333; font-size: 3.5rem;">NAKAVT!</h1>
            <p style="font-size: 1.5rem; margin-bottom: 20px;">Toplam Skorun: <span id="final-score">0</span></p>
            <button class="diff-btn" style="background: #ffcc00;" onclick="location.reload()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        let selectedImg = '';
        let selectedName = '';
        let config = { playerSpeed: 5, enemySpeed: 2, maxAmmo: 30 };

        let player = { x: 75, y: 0, hp: 100, score: 0, ammo: 30, angle: 0 };
        let keys = {};
        let desks = [];
        let enemies = [];
        let bullets = [];
        let isMobile = false;

        // Çift Joystick Verileri
        let moveJoy = { x: 0, y: 0, active: false };
        let shootJoy = { x: 0, y: 0, active: false };

        const gameArea = document.getElementById('game-area');
        const playerEl = document.getElementById('player');
        const pNameTag = document.getElementById('player-name-tag');

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            isMobile = true;
            document.getElementById('mobile-controls').style.display = 'block';
        }

        // Popup Yönetimi
        function openPopup() { document.getElementById('popup-msg').classList.remove('hidden'); }
        function closePopup() { document.getElementById('popup-msg').classList.add('hidden'); }

        function selectCharacter(img, name) {
            selectedImg = img;
            selectedName = name;
            document.getElementById('char-screen').classList.add('hidden');
            document.getElementById('diff-screen').classList.remove('hidden');
        }

        function setDifficulty(diff) {
            document.getElementById('diff-screen').classList.add('hidden');
            gameArea.style.display = 'block';

            player.y = window.innerHeight - 55; // Kırmızı çöp kutusu hizası

            if (diff === 'easy') { config.enemySpeed = 2.0; config.maxAmmo = 50; }
            else if (diff === 'medium') { config.enemySpeed = 3.5; config.maxAmmo = 30; }
            else if (diff === 'hard') { config.enemySpeed = 5.0; config.maxAmmo = 15; }

            player.ammo = config.maxAmmo;
            playerEl.style.backgroundImage = `url('${selectedImg}')`;
            pNameTag.innerText = selectedName;

            buildClassroomDesks();
            initGameLoop();
        }

        function buildClassroomDesks() {
            const room = document.getElementById('room-area');
            const roomHeight = window.innerHeight * 0.5;
            const roomWidth = window.innerWidth;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 6; col++) {
                    const d = document.createElement('div');
                    d.classList.add('desk');
                    d.innerText = "SIRA";
                    let w = 75, h = 45;
                    let x = 140 + col * (w + 50);
                    let y = 110 + row * (h + 30);

                    if (x + w < roomWidth && y + h < roomHeight - 15) {
                        d.style.left = x + 'px'; d.style.top = y + 'px';
                        d.style.width = w + 'px'; d.style.height = h + 'px';
                        room.appendChild(d);
                        desks.push({ x: x, y: y, w: w, h: h });
                    }
                }
            }
        }

        // PC Klavye ve Mouse İşlemleri
        document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        window.addEventListener('click', (e) => {
            if (gameArea.style.display !== 'block' || isMobile) return;
            shootBullet(Math.atan2(e.clientY - player.y, e.clientX - player.x));
        });

        // GELİŞMİŞ MOBİL ÇİFT JOYSTICK KONTROLLERİ
        setupJoystick('move-joy-container', 'move-stick', (x, y) => {
            moveJoy.x = x; moveJoy.y = y;
        });

        // Brawl Stars Usulü: Çek, Nişan Al, Bıraktığında Çat Diye Ateş Et!
        const shootJoyContainer = document.getElementById('shoot-joy-container');
        const shootStick = document.getElementById('shoot-stick');

        shootJoyContainer.addEventListener('touchstart', (e) => { shootJoy.active = true; handleShootJoy(e); });
        shootJoyContainer.addEventListener('touchmove', (e) => { if (shootJoy.active) handleShootJoy(e); });
        shootJoyContainer.addEventListener('touchend', () => {
            if (shootJoy.active) {
                // Bırakıldığı an nişan alınan açıya mermiyi fırlat
                if (Math.hypot(shootJoy.x, shootJoy.y) > 0.2) {
                    shootBullet(Math.atan2(shootJoy.y, shootJoy.x));
                }
                shootStick.style.transform = `translate(0px, 0px)`;
                shootJoy.x = 0; shootJoy.y = 0; shootJoy.active = false;
            }
        });

        function handleShootJoy(e) {
            const touch = e.touches[0] || e.changedTouches[0];
            const rect = shootJoyContainer.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx; let dy = touch.clientY - cy;
            let dist = Math.hypot(dx, dy); let maxDist = rect.width / 2;

            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
            shootStick.style.transform = `translate(${dx}px, ${dy}px)`;
            shootJoy.x = dx / maxDist; shootJoy.y = dy / maxDist;
        }

        function setupJoystick(containerId, stickId, callback) {
            const container = document.getElementById(containerId);
            const stick = document.getElementById(stickId);

            container.addEventListener('touchstart', handleMove);
            container.addEventListener('touchmove', handleMove);
            container.addEventListener('touchend', () => {
                stick.style.transform = `translate(0px, 0px)`;
                callback(0, 0);
            });

            function handleMove(e) {
                const touch = e.touches[0];
                const rect = container.getBoundingClientRect();
                const cx = rect.left + rect.width / 2; const cy = rect.top + rect.height / 2;
                let dx = touch.clientX - cx; let dy = touch.clientY - cy;
                let dist = Math.hypot(dx, dy); let maxDist = rect.width / 2;

                if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                callback(dx / maxDist, dy / maxDist);
            }
        }

        function shootBullet(angle) {
            if (player.ammo <= 0) return;
            player.ammo--;
            document.getElementById('hud-ammo').innerText = player.ammo;

            const bEl = document.createElement('div');
            bEl.classList.add('bullet');
            gameArea.appendChild(bEl);

            bullets.push({
                el: bEl, x: player.x, y: player.y,
                vx: Math.cos(angle) * 14, vy: Math.sin(angle) * 14
            });
        }

        function spawnEnemy() {
            if (gameArea.style.display !== 'block') return;

            const eEl = document.createElement('div');
            eEl.classList.add('enemy', 'enemy-monster-style');
            
            const txt = document.createElement('div');
            txt.classList.add('enemy-text');
            txt.innerText = 'KÜRT';
            eEl.appendChild(txt);
            gameArea.appendChild(eEl);

            enemies.push({ el: eEl, x: window.innerWidth + 60, y: Math.random() * window.innerHeight });
        }

        function initGameLoop() {
            setInterval(spawnEnemy, 1800);

            function update() {
                let speed = config.playerSpeed;

                // Sınıf içi sıralarda yavaşlama kontrolü
                let insideDesk = false;
                for (let d of desks) {
                    if (player.x >= d.x && player.x <= d.x + d.w && player.y >= d.y && player.y <= d.y + d.h) {
                        insideDesk = true; break;
                    }
                }
                if (insideDesk) speed *= 0.45;

                // Klavye yönlendirmesi
                if (keys['w'] || keys['arrowup']) player.y -= speed;
                if (keys['s'] || keys['arrowdown']) player.y += speed;
                if (keys['a'] || keys['arrowleft']) player.x -= speed;
                if (keys['d'] || keys['arrowright']) player.x += speed;

                // Mobil joystick yönlendirmesi
                if (isMobile && (Math.abs(moveJoy.x) > 0.05 || Math.abs(moveJoy.y) > 0.05)) {
                    player.x += moveJoy.x * speed;
                    player.y += moveJoy.y * speed;
                }

                // Sınır koruması
                if (player.x < 25) player.x = 25;
                if (player.x > window.innerWidth - 25) player.x = window.innerWidth - 25;
                if (player.y < 25) player.y = 25;
                if (player.y > window.innerHeight - 25) player.y = window.innerHeight - 25;

                playerEl.style.left = player.x + 'px';
                playerEl.style.top = player.y + 'px';

                // Mermi takibi
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                    b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';

                    if (b.x < 0 || b.x > window.innerWidth || b.y < 0 || b.y > window.innerHeight) {
                        b.el.remove(); bullets.splice(i, 1); continue;
                    }

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let e = enemies[j];
                        if (Math.hypot(b.x - e.x, b.y - e.y) < 32) {
                            e.el.remove(); enemies.splice(j, 1);
                            b.el.remove(); bullets.splice(i, 1);
                            player.score += 10;
                            document.getElementById('hud-score').innerText = player.score;
                            break;
                        }
                    }
                }

                // Düşman takibi (KÜRT)
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * config.enemySpeed;
                    e.y += Math.sin(angle) * config.enemySpeed;
                    e.el.style.left = e.x + 'px'; e.el.style.top = e.y + 'px';

                    if (Math.hypot(player.x - e.x, player.y - e.y) < 48) {
                        player.hp -= 10;
                        document.getElementById('hud-hp').innerText = player.hp;
                        e.el.remove(); enemies.splice(j, 1);
                        if (player.hp <= 0) {
                            document.getElementById('game-over').classList.remove('hidden');
                            document.getElementById('final-score').innerText = player.score;
                        }
                    }
                }

                if (player.hp > 0) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }
    </script>
</body>
</html>
